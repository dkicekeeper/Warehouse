name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # Linux only: Warehouse must never add to the macOS queue it is built to show.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      # The same suite again, through the production driver against a real server: the in-process
      # database and postgres.js encode parameters differently, and only this run proves the SQL.
      - run: pnpm test:pg
        env:
          TEST_DATABASE_URL: postgres://postgres@127.0.0.1:5432/postgres
      - run: pnpm exec playwright install --with-deps chromium
      # Builds the app, starts it with no database and no secrets, and drives it in a browser.
      - run: pnpm test:e2e
